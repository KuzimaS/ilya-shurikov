name: Sync adaptation dashboard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-adaptation.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch current dashboard state
        run: |
          curl --fail --silent --show-error --retry 3 "https://adaptation-race.clinf.chatgpt.site/api/state" --output /tmp/adaptation-response.json
          jq '
            .state
            | .managers |= map(
                (if .name == "Григорьева Екатерина" then .id = "mgr-20260827-11" else . end)
                | .note = (
                    (.note // "")
                    | split("\n\n")
                    | reduce .[] as $part ([];
                        if ($part == "" or index($part)) then . else . + [$part] end
                      )
                    | join("\n\n")
                  )
              )
          ' /tmp/adaptation-response.json > adaptation/state.json.tmp

          duplicate_ids="$(jq -r '
            .managers
            | sort_by(.id)
            | group_by(.id)
            | map(select(length > 1) | .[0].id)
            | .[]
          ' adaptation/state.json.tmp)"

          if [ -n "$duplicate_ids" ]; then
            echo "::error::Duplicate manager IDs detected: $duplicate_ids"
            exit 1
          fi

          mv adaptation/state.json.tmp adaptation/state.json

      - name: Publish changes
        run: |
          git config user.name "adaptation-sync"
          git config user.email "actions@users.noreply.github.com"
          git add adaptation/state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Sync adaptation dashboard data"
          git push origin HEAD:gh-pages

