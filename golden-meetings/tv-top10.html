<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101b">
  <title>ТВ · Топ-10 конкурса</title>
  <style>
    :root{--bg:#07101b;--panel:#0d1928;--line:#26384f;--text:#f5f1e7;--muted:#8294aa;--gold:#efb83d}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
    .screen{height:100vh;display:grid;grid-template-rows:126px minmax(0,1fr) 34px;padding:14px 18px 8px;gap:8px}
    header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.kicker{color:#f1c35e;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:6px 0 0;font-size:31px;line-height:1}.sub{margin-top:7px;color:#91a1b4;font-size:13px}.stats{display:flex;gap:7px}.stat{min-width:150px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091421}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.07em;text-transform:uppercase}.stat b{display:block;margin-top:3px;font-size:21px}.stat.money b{color:#ffd36d}
    .board{min-height:0;display:grid;grid-template-rows:repeat(10,minmax(0,1fr));gap:5px}.row{display:grid;grid-template-columns:55px minmax(260px,1.4fr) 125px 105px 115px 145px 145px 165px;gap:11px;align-items:center;padding:7px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.rank{width:40px;height:40px;display:grid;place-items:center;border:1px solid #40536c;border-radius:9px;background:#18273a;color:#91a4ba;font-size:17px;font-weight:900}.rank.top1{background:#e2ad34;color:#241600}.rank.top2{background:#aab4c0;color:#15202d}.rank.top3{background:#b97842;color:#241409}.person b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;margin-top:3px;color:#7f91a8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric span{display:block;color:#71849a;font-size:9px;letter-spacing:.07em;text-transform:uppercase}.metric b{display:block;margin-top:4px;font-size:18px}.metric.money b,.total b{color:#ffd36d}.total{padding:8px 12px;border-left:2px solid #785a23}.total span{display:block;color:#947a49;font-size:9px;letter-spacing:.07em;text-transform:uppercase}.total b{display:block;margin-top:4px;font-size:21px}.nav a{margin-right:16px;color:#71849a;text-decoration:none}.nav a:hover{color:#ffd875}.updated{color:#71849a;font-size:11px}
    @media(max-width:1500px){.screen{padding:10px 12px 6px;grid-template-rows:116px minmax(0,1fr) 28px}.title{font-size:25px}.stat{min-width:125px}.row{grid-template-columns:48px minmax(210px,1.3fr) 100px 85px 90px 112px 112px 135px;gap:8px}.person b{font-size:14px}.metric b{font-size:15px}.total b{font-size:17px}}
  </style>
</head>
<body>
  <div class="screen">
    <header><div><div class="kicker">Новый спринт · 7-30 сентября 2026</div><h1 class="title">Топ-10 конкурса</h1><div class="sub">Рейтинг по общей сумме заработанных призов</div></div><div class="stats"><div class="stat"><span>Участников</span><b id="peopleCount">65</b></div><div class="stat"><span>Назначено</span><b id="assigned">0</b></div><div class="stat"><span>Проведено</span><b id="held">0</b></div><div class="stat money"><span>Общий фонд</span><b id="money">0 ₽</b></div></div></header>
    <main class="board" id="board"></main>
    <footer style="display:flex;align-items:center;justify-content:space-between"><div class="nav"><a href="./tv-assigned.html?scope=top10">Топ по назначениям</a><a href="./tv-held.html?scope=top10">Топ по проведённым</a></div><span class="updated">Обновляется при изменении данных</span><a class="updated" href="./index.html" style="text-decoration:none">Техническая панель</a></footer>
  </div>
  <script src="./contest-data.js"></script>
  <script>
    const allPeople=window.ContestPeople,milestones=window.ContestMilestones,key='golden-meetings-september-7-30-2026-v1',formatter=new Intl.NumberFormat('ru-RU');let state;
    const period=a=>a.slice(6,30),rub=n=>formatter.format(n)+' ₽',assignedTotal=p=>period(state.assigned[p.id]).reduce((a,b)=>a+b,0),assignedBonus=p=>period(state.assigned[p.id]).reduce((sum,n)=>sum+Math.max(0,n-3)*1000,0),heldReward=p=>{let value=0;milestones.forEach(m=>{if(state.held[p.id]>=m.n)value=m.p});return value};
    function blank(){const assigned={},held={};allPeople.forEach(p=>{assigned[p.id]=Array(30).fill(0);held[p.id]=0});return{assigned,held}}
    function load(){const base=blank();try{const raw=localStorage.getItem(key),saved=raw?JSON.parse(raw):window.ContestPublishedState;allPeople.forEach(p=>{if(Array.isArray(saved?.assigned?.[p.id]))base.assigned[p.id]=Array.from({length:30},(_,i)=>Math.max(0,Number(saved.assigned[p.id][i])||0));base.held[p.id]=Math.max(0,Number(saved?.held?.[p.id])||0)})}catch{}return base}
    function render(){state=load();const ordered=[...allPeople].sort((a,b)=>(assignedBonus(b)+heldReward(b))-(assignedBonus(a)+heldReward(a))||state.held[b.id]-state.held[a.id]||assignedTotal(b)-assignedTotal(a)||allPeople.indexOf(a)-allPeople.indexOf(b)).slice(0,10),board=document.getElementById('board');board.textContent='';ordered.forEach((p,i)=>{const row=document.createElement('section'),rank=document.createElement('div'),person=document.createElement('div'),pb=document.createElement('b'),ps=document.createElement('small');row.className='row';rank.className='rank '+(i===0?'top1':i===1?'top2':i===2?'top3':'');rank.textContent=i+1;person.className='person';pb.textContent=p.name;ps.textContent=p.dept+' · '+p.role;person.append(pb,ps);const values=[['Назначено',assignedTotal(p)],['Золотых дней',period(state.assigned[p.id]).filter(n=>n>=3).length],['Проведено',state.held[p.id]],['Бонус назначений',rub(assignedBonus(p))],['Награда встреч',rub(heldReward(p))]];row.append(rank,person);values.forEach((v,j)=>{const box=document.createElement('div'),s=document.createElement('span'),b=document.createElement('b');box.className='metric '+(j>=3?'money':'');s.textContent=v[0];b.textContent=v[1];box.append(s,b);row.appendChild(box)});const total=document.createElement('div'),ts=document.createElement('span'),tb=document.createElement('b');total.className='total';ts.textContent='Всего призов';tb.textContent=rub(assignedBonus(p)+heldReward(p));total.append(ts,tb);row.appendChild(total);board.appendChild(row)});const assigned=allPeople.reduce((s,p)=>s+assignedTotal(p),0),held=allPeople.reduce((s,p)=>s+state.held[p.id],0),money=allPeople.reduce((s,p)=>s+assignedBonus(p)+heldReward(p),0);document.getElementById('assigned').textContent=assigned;document.getElementById('held').textContent=held;document.getElementById('money').textContent=rub(money)}
    render();addEventListener('storage',render);addEventListener('focus',render);
  </script>
</body>
</html>
