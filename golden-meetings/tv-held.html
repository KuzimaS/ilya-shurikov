<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101b">
  <title>ТВ · Проведённые встречи</title>
  <style>
    :root{--bg:#07101b;--panel:#0d1928;--line:#26384f;--text:#f5f1e7;--muted:#8294aa;--gold:#efb83d;--cols:48px 292px 76px repeat(8,minmax(76px,1fr)) 138px 154px}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
    .screen{height:100vh;display:grid;grid-template-rows:126px minmax(0,1fr) 34px;padding:14px 18px 8px;gap:8px}
    header{display:grid;grid-template-columns:minmax(450px,1fr) auto;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .kicker{color:#f1c35e;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title-line{display:flex;align-items:center;gap:12px;margin-top:6px}.title{margin:0;font-size:30px;line-height:1}.sub{margin-top:7px;color:#91a1b4;font-size:13px}.scope{height:34px;max-width:250px;padding:0 30px 0 10px;border:1px solid #40536c;border-radius:8px;background:#111f31;color:#f7f2e7;font-size:13px;font-weight:700}
    .stats{display:flex;gap:7px}.stat{min-width:126px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091421}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.07em;text-transform:uppercase}.stat b{display:block;margin-top:3px;font-size:21px}.stat.money b{color:#ffd36d}
    .board{--rows:10;min-height:0;display:grid;grid-template-rows:46px repeat(var(--rows),minmax(0,1fr));gap:3px;overflow:hidden}
    .head,.data-row{display:grid;grid-template-columns:var(--cols);align-items:stretch;min-width:0}.head{border:1px solid var(--line);border-radius:9px 9px 5px 5px;overflow:hidden;background:#111f31}.data-row{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}.empty{display:none}
    .hcell,.cell{min-width:0;display:flex;align-items:center;justify-content:center;border-right:1px solid #1f3046}.hcell:last-child,.cell:last-child{border-right:0}.hcell{padding:3px;color:#8fa1b7;font-size:9px;font-weight:900;line-height:1.15;letter-spacing:.04em;text-align:center;text-transform:uppercase}.hcell.left{justify-content:flex-start;padding-left:12px}.hcell.step-head{flex-direction:column;color:#bea46a}.hcell.step-head b{color:#f4ca69;font-size:14px}.hcell.step-head small{margin-top:2px;color:#7f91a8;font-size:8px}
    .rank{color:#778aa1;font-size:15px;font-weight:900}.rank.top1{background:#e2ad34;color:#241600}.rank.top2{background:#aab4c0;color:#15202d}.rank.top3{background:#b97842;color:#241409}
    .person{display:block;padding:0 11px;align-content:center}.person b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;margin-top:3px;color:#7f91a8;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .count{flex-direction:column;background:#101c2c}.count b{font-size:25px;line-height:1}.count small{margin-top:2px;color:#71849a;font-size:8px;text-transform:uppercase}
    .step{background:#101c2c;color:#4e6076;font-size:14px;font-weight:900}.step.reached{background:#e5ac2d;color:#211500}.step.active{color:#ffe39a}.step.future{color:#3d4d61}.step small{font-size:9px;font-weight:800}
    .reward{flex-direction:column;background:#171c24}.reward b{color:#ffd36d;font-size:16px}.reward small,.next small{margin-bottom:3px;color:#71849a;font-size:8px;letter-spacing:.05em;text-transform:uppercase}.next{flex-direction:column;padding:0 5px;text-align:center}.next b{font-size:11px;line-height:1.15}.next.max b{color:#ffe39a}
    .dept-board{--dept-rows:8;min-height:0;display:grid;grid-template-rows:52px repeat(var(--dept-rows),minmax(0,1fr));gap:5px;overflow:hidden}.dept-head,.dept-row{display:grid;grid-template-columns:92px minmax(340px,1fr) 260px;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}.dept-head{background:#111f31}.dept-row{background:var(--panel)}.dept-head>div,.dept-row>div{display:flex;align-items:center;border-right:1px solid #1f3046}.dept-head>div:last-child,.dept-row>div:last-child{border-right:0}.dept-head>div{justify-content:center;color:#8fa1b7;font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.dept-name{padding:0 28px;font-size:24px;font-weight:900}.dept-total{justify-content:center;background:#101c2c;color:#ffd36d;font-size:34px;font-weight:900}.dept-rank{justify-content:center;background:#18273a;color:#91a4ba;font-size:26px;font-weight:900}.dept-rank.top1{background:#e2ad34;color:#241600}.dept-rank.top2{background:#aab4c0;color:#15202d}.dept-rank.top3{background:#b97842;color:#241409}
    footer{display:flex;align-items:center;justify-content:space-between;padding:0 4px;color:#71849a;font-size:11px}.screen-no{color:#a6b3c2}.screen-no b{color:#efb83d}.tech{color:#71849a;text-decoration:none}.tech:hover{color:#ffd875}
    @media(max-width:1500px){:root{--cols:40px 218px 60px repeat(8,minmax(62px,1fr)) 104px 118px}.screen{padding:10px 12px 6px;grid-template-rows:116px minmax(0,1fr) 28px}.title{font-size:25px}.stat{min-width:105px}.person{padding:0 7px}.person b{font-size:12px}.person small{font-size:8px}.count b{font-size:21px}.reward b{font-size:13px}.next b{font-size:9px}.hcell{font-size:8px}.hcell.step-head b{font-size:12px}.dept-head,.dept-row{grid-template-columns:72px minmax(280px,1fr) 210px}.dept-name{padding:0 22px;font-size:20px}.dept-total{font-size:29px}.dept-rank{font-size:23px}}
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div><div class="kicker">Новый спринт · 7-30 сентября 2026</div><div class="title-line"><h1 class="title" id="title">Проведённые встречи</h1><select class="scope" id="scope" aria-label="Выбор отдела"></select></div><div class="sub" id="sub">Реалистичная лестница по августовскому темпу: от 3 встреч до суперприза за 15</div></div>
      <div class="stats"><div class="stat"><span id="countLabel">В списке</span><b id="peopleCount">0</b></div><div class="stat"><span>Проведено</span><b id="held">0</b></div><div class="stat"><span>С наградой</span><b id="winners">0</b></div><div class="stat money"><span>Призовой фонд</span><b id="money">0 ₽</b></div></div>
    </header>
    <main class="board" id="board"></main>
    <footer><span id="hint">Золотая ячейка означает пройденную ступень</span><span class="screen-no" id="screenNo"></span><a class="tech" href="./index.html">Техническая панель</a></footer>
  </div>
  <script src="./contest-data.js"></script>
  <script>
    const allPeople=window.ContestPeople,milestones=window.ContestMilestones,key='golden-meetings-september-7-30-2026-v1',formatter=new Intl.NumberFormat('ru-RU');
    const params=new URLSearchParams(location.search),scopeValue=params.get('scope')||'all';
    let page=0,held={},people=[],rowLimit=10,pageCount=1,rows=[],deptRows=[];
    const rub=n=>formatter.format(n)+' ₽';
    const reward=n=>{let p=0;milestones.forEach(m=>{if(n>=m.n)p=m.p});return p},next=n=>milestones.find(m=>n<m.n)||null;
    function load(){const data={};allPeople.forEach(p=>data[p.id]=0);try{const raw=localStorage.getItem(key),saved=raw?JSON.parse(raw):window.ContestPublishedState;allPeople.forEach(p=>data[p.id]=Math.max(0,Number(saved?.held?.[p.id])||0))}catch{}return data}
    function setPeople(){if(scopeValue==='departments'){people=[...allPeople];rowLimit=1;pageCount=1;page=0;return}let list=[...allPeople].sort((a,b)=>held[b.id]-held[a.id]||reward(held[b.id])-reward(held[a.id])||allPeople.indexOf(a)-allPeople.indexOf(b));if(scopeValue==='top10')list=list.slice(0,10);else if(scopeValue.startsWith('dept:'))list=list.filter(p=>p.dept===scopeValue.slice(5));people=list;rowLimit=scopeValue.startsWith('dept:')?Math.max(1,people.length):10;pageCount=Math.max(1,Math.ceil(people.length/rowLimit));if(page>=pageCount)page=0}
    function buildScope(){const select=document.getElementById('scope'),departments=[...new Set(allPeople.map(p=>p.dept))];[['all','Все отделы'],['top10','Топ-10 сотрудников'],['departments','Топ отделов'],...departments.map(d=>['dept:'+d,d])].forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;select.appendChild(o)});select.value=scopeValue;select.onchange=()=>{const url=new URL(location.href);if(select.value==='all')url.searchParams.delete('scope');else url.searchParams.set('scope',select.value);location.href=url.href}}
    function makeCell(className,text){const el=document.createElement('div');el.className=className;if(text!==undefined)el.textContent=text;return el}
    function build(){const board=document.getElementById('board');board.style.setProperty('--rows',rowLimit);const head=document.createElement('div');head.className='head';head.append(makeCell('hcell','#'),makeCell('hcell left','Сотрудник'),makeCell('hcell','Факт'));milestones.forEach(m=>{const c=makeCell('hcell step-head'),b=document.createElement('b'),s=document.createElement('small');b.textContent=m.n;s.textContent=formatter.format(m.p/1000)+' тыс.';c.append(b,s);head.appendChild(c)});head.append(makeCell('hcell','Получено'),makeCell('hcell','Следующая цель'));board.appendChild(head);for(let i=0;i<rowLimit;i++){const row=document.createElement('section'),rank=makeCell('cell rank'),person=makeCell('cell person'),pb=document.createElement('b'),ps=document.createElement('small'),count=makeCell('cell count'),cb=document.createElement('b'),cs=document.createElement('small'),steps=milestones.map(()=>makeCell('cell step')),rewardBox=makeCell('cell reward'),rewardLabel=document.createElement('small'),rewardB=document.createElement('b'),nextBox=makeCell('cell next'),nextLabel=document.createElement('small'),nextB=document.createElement('b');row.className='data-row';person.append(pb,ps);cs.textContent='встреч';count.append(cb,cs);rewardLabel.textContent='Получено';rewardBox.append(rewardLabel,rewardB);nextLabel.textContent='До ступени';nextBox.append(nextLabel,nextB);row.append(rank,person,count,...steps,rewardBox,nextBox);board.appendChild(row);rows.push({row,rank,pb,ps,cb,steps,rewardBox,rewardB,nextBox,nextB})}}
    function departmentRanking(){const totals=new Map();allPeople.forEach(p=>totals.set(p.dept,(totals.get(p.dept)||0)+held[p.id]));return [...totals].map(([dept,total])=>({dept,total})).sort((a,b)=>b.total-a.total||a.dept.localeCompare(b.dept,'ru'))}
    function buildDepartments(){const board=document.getElementById('board'),ranking=departmentRanking();board.className='dept-board';board.style.setProperty('--dept-rows',ranking.length);const head=document.createElement('div');head.className='dept-head';head.append(makeCell('','Место'),makeCell('','Отдел'),makeCell('','Проведено всего'));board.appendChild(head);ranking.forEach(()=>{const row=document.createElement('section'),rank=makeCell('dept-rank'),name=makeCell('dept-name'),total=makeCell('dept-total');row.className='dept-row';row.append(rank,name,total);board.appendChild(row);deptRows.push({rank,name,total})});document.getElementById('title').textContent='Топ отделов по проведённым';document.getElementById('sub').textContent='Место отдела определяется по общему количеству проведённых встреч';document.getElementById('hint').textContent='Результат считается по всем сотрудникам отдела за период 7-30 сентября'}
    function totals(){const total=people.reduce((s,p)=>s+held[p.id],0),winners=people.filter(p=>reward(held[p.id])>0).length,money=people.reduce((s,p)=>s+reward(held[p.id]),0),ranking=departmentRanking();document.getElementById('countLabel').textContent=scopeValue==='departments'?'Отделов':'В списке';document.getElementById('peopleCount').textContent=scopeValue==='departments'?ranking.length:people.length;document.getElementById('held').textContent=total;document.getElementById('winners').textContent=winners;document.getElementById('money').textContent=rub(money)}
    function paintStep(cell,n,m,index){const previous=index?milestones[index-1].n:0;if(n>=m.n){cell.className='cell step reached';cell.textContent='✓';cell.style.background='';return}if(n>previous&&n<m.n){const progress=Math.max(0,Math.min(1,(n-previous)/(m.n-previous))),alpha=(.12+progress*.56).toFixed(2);cell.className='cell step active';cell.textContent=n+'/'+m.n;cell.style.background='rgba(229,172,45,'+alpha+')';return}cell.className='cell step future';cell.textContent='·';cell.style.background=''}
    function render(){rows.forEach((r,i)=>{const p=people[page*rowLimit+i];r.row.classList.toggle('empty',!p);if(!p)return;const n=held[p.id],earned=reward(n),goal=next(n),rank=page*rowLimit+i+1;r.rank.textContent=rank;r.rank.className='cell rank '+(rank===1?'top1':rank===2?'top2':rank===3?'top3':'');r.pb.textContent=p.name;r.ps.textContent=p.dept+' · '+p.role;r.cb.textContent=n;r.steps.forEach((cell,j)=>paintStep(cell,n,milestones[j],j));r.rewardB.textContent=rub(earned);r.rewardBox.className='cell reward'+(!goal?' max':'');r.nextBox.className='cell next'+(!goal?' max':'');r.nextB.textContent=goal?(goal.n-n)+' до '+goal.n:'Суперприз открыт'});document.getElementById('screenNo').innerHTML='Экран <b>'+(page+1)+'</b> из '+pageCount}
    function renderDepartments(){departmentRanking().forEach((item,i)=>{const r=deptRows[i];r.rank.textContent=i+1;r.rank.className='dept-rank '+(i===0?'top1':i===1?'top2':i===2?'top3':'');r.name.textContent=item.dept;r.total.textContent=formatter.format(item.total)});document.getElementById('screenNo').innerHTML='<b>'+deptRows.length+'</b> отделов'}
    function forward(){if(scopeValue==='departments')return;page=(page+1)%pageCount;render()}function backward(){if(scopeValue==='departments')return;page=(page-1+pageCount)%pageCount;render()}function refresh(){held=load();setPeople();totals();scopeValue==='departments'?renderDepartments():render()}
    held=load();buildScope();setPeople();if(scopeValue==='departments'){buildDepartments();totals();renderDepartments()}else{build();totals();render()}setInterval(()=>{if(!document.hidden&&pageCount>1)forward()},30000);addEventListener('storage',refresh);addEventListener('focus',refresh);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')forward();if(e.key==='ArrowLeft'||e.key==='PageUp')backward()});
  </script>
</body>
</html>
