<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#060b14">
  <title>ТВ · Проведённые встречи</title>
  <style>
    :root{--bg:#060b14;--panel:#0d1928;--line:#203149;--text:#f7f2e5;--muted:#8396af;--gold:#f4bd45}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
    body{background:#060b14}.screen{height:100vh;display:grid;grid-template-rows:142px minmax(0,1fr) 38px;padding:18px 22px 10px;gap:10px}
    header{display:grid;grid-template-columns:1fr auto;align-items:start;padding:18px 21px;border:1px solid #24354c;border-radius:18px;background:#0d1928;contain:layout paint style}
    .kicker{color:#ffd875;text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:900}.title{margin:7px 0 0;font-size:34px;line-height:1;letter-spacing:-.025em}.sub{margin-top:9px;color:#93a5bc;font-size:14px}.gold{color:#ffd875}
    .stats{display:flex;gap:8px}.stat{min-width:150px;padding:12px 14px;background:#08111e;border:1px solid #24354c;border-radius:12px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.stat b{display:block;margin-top:5px;font-size:23px}.stat.money b{color:#ffd875}
    .board{min-height:0;display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:6px;overflow:hidden;contain:strict}
    .row{display:grid;grid-template-columns:50px 260px 84px minmax(500px,1fr) 145px 180px;gap:12px;align-items:center;padding:9px 14px;border:1px solid #24354c;border-radius:12px;background:#0d1928;contain:layout paint style}.empty{visibility:hidden}
    .rank{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:#1a283b;border:1px solid #30425b;color:#8ca0b9;font-size:16px;font-weight:950}.rank.top1{background:#e3ae34;border-color:#ffe59a;color:#271600}.rank.top2{background:#a7b1bd;color:#17202b}.rank.top3{background:#b87842;color:#27170c}
    .person b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{display:block;margin-top:3px;color:#778ba5;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{text-align:center}.count b{display:block;font-size:27px;color:#f4f7fb}.count span{display:block;color:#6f829a;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
    .progress{padding:14px 3px 10px}.rail{height:7px;border-radius:20px;background:#26354a;position:relative}.fill{height:100%;border-radius:20px;background:#d99d27}.nodes{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}.node{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1c2a3d;border:2px solid #35485f;color:#7489a5;font-size:9px;font-weight:950;position:relative}.node.hit{background:#e3ae34;border-color:#ffe59a;color:#2a1800}.node i{position:absolute;top:25px;font-style:normal;font-size:8px;color:#61758f;white-space:nowrap}.node.hit i{color:#d6aa50}
    .reward span,.next span{display:block;color:#71859e;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.reward b{display:block;margin-top:4px;color:#ffd572;font-size:20px}.next b{display:block;margin-top:5px;color:#dce5ef;font-size:12px}.max b{color:#fff0b3}
    footer{display:flex;align-items:center;justify-content:space-between;padding:0 5px;color:#73869e;font-size:11px}.levels{display:flex;gap:11px}.levels b{color:#d6a94f}.pager{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:20px;background:#304057}.dot.active{width:24px;background:#e9ad37}.tech{color:#71849b;text-decoration:none}.tech:hover{color:#ffd875}
    @media(max-width:1500px){.screen{padding:12px 14px 7px;grid-template-rows:128px minmax(0,1fr) 32px}.title{font-size:28px}.stat{min-width:128px;padding:10px 12px}.row{grid-template-columns:44px 220px 70px minmax(420px,1fr) 120px 150px}.person b{font-size:13px}.reward b{font-size:17px}}
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div><div class="kicker">Золотой календарь · сентябрь 2026</div><h1 class="title">Проведённые встречи</h1><div class="sub">Каждая ступень открывает новую награду · суперприз: <span class="gold">70 000 ₽ за 30 встреч</span></div></div>
      <div class="stats"><div class="stat"><span>Участников</span><b id="people">65</b></div><div class="stat"><span>Проведено</span><b id="held">0</b></div><div class="stat"><span>Получили награду</span><b id="winners">0</b></div><div class="stat money"><span>Призовой фонд</span><b id="money">0 ₽</b></div></div>
    </header>
    <main class="board" id="board"></main>
    <footer><div class="levels">Уровни: <b>5</b> 10к · <b>7</b> 15к · <b>10</b> 25к · <b>12</b> 30к · <b>15</b> 40к · <b>20</b> 50к · <b>25</b> 60к · <b>30</b> 70к</div><div class="pager" id="pager"></div><a class="tech" href="./index.html">Техническая панель</a></footer>
  </div>
  <script src="./contest-data.js"></script>
  <script>
    const people=window.ContestPeople,milestones=window.ContestMilestones,key='golden-meetings-september-2026-v1',perPage=8,pageCount=Math.ceil(people.length/perPage),formatter=new Intl.NumberFormat('ru-RU');
    let page=0,lastRaw='',held,ordered=[],rows=[],dots=[];
    const rub=n=>formatter.format(n)+' ₽';
    const reward=n=>{let p=0;milestones.forEach(m=>{if(n>=m.n)p=m.p});return p};
    const next=n=>milestones.find(m=>n<m.n)||null;
    function load(){const nextHeld={};people.forEach(p=>nextHeld[p.id]=0);try{const raw=localStorage.getItem(key);lastRaw=raw||'';const saved=raw?JSON.parse(raw):window.ContestPublishedState;people.forEach(p=>nextHeld[p.id]=Math.max(0,Number(saved?.held?.[p.id])||0))}catch{}return nextHeld}
    function sortPeople(){ordered=[...people].sort((a,b)=>held[b.id]-held[a.id]||reward(held[b.id])-reward(held[a.id])||people.indexOf(a)-people.indexOf(b))}
    function build(){
      const board=document.getElementById('board');
      for(let i=0;i<perPage;i++){
        const row=document.createElement('section');row.className='row';
        const rank=document.createElement('div');rank.className='rank';
        const person=document.createElement('div'),personB=document.createElement('b'),personSmall=document.createElement('small');person.className='person';person.append(personB,personSmall);
        const count=document.createElement('div'),countB=document.createElement('b'),countSpan=document.createElement('span');count.className='count';countSpan.textContent='встреч';count.append(countB,countSpan);
        const progress=document.createElement('div'),rail=document.createElement('div'),fill=document.createElement('div'),nodes=document.createElement('div');progress.className='progress';rail.className='rail';fill.className='fill';nodes.className='nodes';const nodeEls=[];
        milestones.forEach(m=>{const node=document.createElement('span'),label=document.createElement('i');node.className='node';node.textContent=m.n;label.textContent=(m.p/1000)+'к';node.appendChild(label);nodes.appendChild(node);nodeEls.push(node)});rail.append(fill,nodes);progress.appendChild(rail);
        const rewardBox=document.createElement('div'),rewardLabel=document.createElement('span'),rewardB=document.createElement('b');rewardBox.className='reward';rewardLabel.textContent='Заработано';rewardBox.append(rewardLabel,rewardB);
        const nextBox=document.createElement('div'),nextLabel=document.createElement('span'),nextB=document.createElement('b');nextBox.className='next';nextLabel.textContent='Следующий уровень';nextBox.append(nextLabel,nextB);
        row.append(rank,person,count,progress,rewardBox,nextBox);board.appendChild(row);rows.push({row,rank,personB,personSmall,countB,fill,nodeEls,rewardBox,rewardB,nextB});
      }
      const pager=document.getElementById('pager');for(let i=0;i<pageCount;i++){const dot=document.createElement('span');dot.className='dot';pager.appendChild(dot);dots.push(dot)}
    }
    function updateTotals(){const total=people.reduce((s,p)=>s+held[p.id],0),winners=people.filter(p=>reward(held[p.id])>0).length,money=people.reduce((s,p)=>s+reward(held[p.id]),0);document.getElementById('held').textContent=total;document.getElementById('winners').textContent=winners;document.getElementById('money').textContent=rub(money)}
    function render(){
      rows.forEach((slot,i)=>{const p=ordered[page*perPage+i];slot.row.classList.toggle('empty',!p);if(!p)return;const n=held[p.id],earned=reward(n),goal=next(n),rank=page*perPage+i+1;slot.rank.textContent=rank;slot.rank.className='rank '+(rank===1?'top1':rank===2?'top2':rank===3?'top3':'');slot.personB.textContent=p.name;slot.personSmall.textContent=p.dept+' · '+p.role;slot.countB.textContent=n;slot.fill.style.width=Math.min(100,n/30*100)+'%';slot.nodeEls.forEach((node,j)=>node.classList.toggle('hit',n>=milestones[j].n));slot.rewardB.textContent=rub(earned);slot.rewardBox.classList.toggle('max',!goal);slot.nextB.textContent=goal?goal.n+' встреч · '+rub(goal.p):'Суперприз открыт'});
      dots.forEach((dot,i)=>dot.classList.toggle('active',i===page));
    }
    function forward(){page=(page+1)%pageCount;render()}
    function backward(){page=(page-1+pageCount)%pageCount;render()}
    function refresh(){const raw=localStorage.getItem(key)||'';if(raw!==lastRaw){held=load();sortPeople();updateTotals();render()}}
    build();held=load();sortPeople();updateTotals();render();
    setInterval(()=>{if(!document.hidden)forward()},12000);setInterval(refresh,30000);
    addEventListener('storage',refresh);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')forward();if(e.key==='ArrowLeft'||e.key==='PageUp')backward()});
  </script>
</body>
</html>
