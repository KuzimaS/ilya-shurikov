<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101b">
  <title>ТВ · Назначенные встречи</title>
  <style>
    :root{--bg:#07101b;--panel:#0d1928;--cell:#101c2c;--line:#26384f;--text:#f5f1e7;--muted:#8294aa;--gold:#efb83d}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
    .screen{height:100vh;display:grid;grid-template-rows:126px minmax(0,1fr) 34px;padding:14px 18px 8px;gap:8px}
    header{display:grid;grid-template-columns:minmax(420px,1fr) auto;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
    .kicker{color:#f1c35e;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title-line{display:flex;align-items:center;gap:12px;margin-top:6px}.title{margin:0;font-size:30px;line-height:1}.range{padding:5px 9px;border:1px solid #755a27;border-radius:7px;color:#ffd978;font-size:12px;font-weight:800;white-space:nowrap}.sub{margin-top:7px;color:#91a1b4;font-size:13px}
    .scope{height:34px;max-width:250px;padding:0 30px 0 10px;border:1px solid #40536c;border-radius:8px;background:#111f31;color:#f7f2e7;font-size:13px;font-weight:700}.stats{display:flex;gap:7px}.stat{min-width:126px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#091421}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:.07em;text-transform:uppercase}.stat b{display:block;margin-top:3px;font-size:21px}.stat.money b{color:#ffd36d}
    .board{min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#0a1523}
    table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:0;border-right:1px solid #1f3046;border-bottom:1px solid #1f3046;text-align:center}thead th{height:44px;background:#111f31;color:#889bb2;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
    .name{width:330px;padding:0 15px;text-align:left;background:#101c2c}.name b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name small{display:block;margin-top:3px;color:#7f91a8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day b{display:block;color:#e5ebf1;font-size:16px}.day small{display:block;margin-top:2px;font-size:10px}.weekend{background:#181b2b!important;color:#bca9ce!important}
    tbody tr{height:calc((100% - 44px)/var(--rows,8))}tbody td{background:var(--cell);font-size:21px;font-weight:900}.metric.lv0{color:#465971}.metric.lv1{background:#2c251f;color:#c9975e}.metric.lv2{background:#514020;color:#ebc66c}.metric.lv3{background:#ae7418;color:#160f04}.metric.lv4{background:#efb83d;color:#1b1203;outline:1px solid #ffe79b;outline-offset:-2px}
    .total{width:92px;background:#111f31;font-size:20px}.gold-days{width:78px;background:#121e2e;color:#dcb14f}.bonus{width:128px;background:#1a1e22;color:#ffd36b;font-size:18px}.empty,.off{display:none}
    .dept-board{--dept-rows:8;min-height:0;display:grid;grid-template-rows:52px repeat(var(--dept-rows),minmax(0,1fr));gap:5px;overflow:hidden;background:transparent;border:0;border-radius:0}.dept-head,.dept-row{display:grid;grid-template-columns:92px minmax(340px,1fr) 260px;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}.dept-head{background:#111f31}.dept-row{background:var(--panel)}.dept-head>div,.dept-row>div{display:flex;align-items:center;border-right:1px solid #1f3046}.dept-head>div:last-child,.dept-row>div:last-child{border-right:0}.dept-head>div{justify-content:center;color:#8fa1b7;font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.dept-name{padding:0 28px;font-size:24px;font-weight:900}.dept-total{justify-content:center;background:#101c2c;color:#ffd36d;font-size:34px;font-weight:900}.dept-rank{justify-content:center;background:#18273a;color:#91a4ba;font-size:26px;font-weight:900}.dept-rank.top1{background:#e2ad34;color:#241600}.dept-rank.top2{background:#aab4c0;color:#15202d}.dept-rank.top3{background:#b97842;color:#241409}
    footer{display:flex;align-items:center;justify-content:space-between;padding:0 4px;color:#71849a;font-size:11px}.screen-no{color:#a6b3c2}.screen-no b{color:#efb83d}.tech{color:#71849a;text-decoration:none}.tech:hover{color:#ffd875}
    @media(max-width:1500px){.screen{padding:10px 12px 6px;grid-template-rows:116px minmax(0,1fr) 28px}.title{font-size:25px}.name{width:260px}.stat{min-width:105px}.name b{font-size:14px}.name small{font-size:10px}.bonus{width:105px}.dept-head,.dept-row{grid-template-columns:72px minmax(280px,1fr) 210px}.dept-name{padding:0 22px;font-size:20px}.dept-total{font-size:29px}.dept-rank{font-size:23px}}
 .sync-stamp{font-size:11px;color:#aab9cc;margin-bottom:6px}.sync-stamp.pending{color:#ffd36a}.screen{grid-template-rows:126px minmax(0,1fr) 30px}.sub{font-size:12px}.stat span{font-size:10px}.stat b{font-size:23px}.scope:focus-visible,a:focus-visible{outline:2px solid #72baff}.dept-name{font-size:clamp(20px,1.8vw,34px)}.dept-total{font-size:clamp(28px,2.3vw,44px)}   </style>
  <link rel="stylesheet" href="./mobile.css?v=5">
</head>
<body>
  <div class="screen">
    <header>
      <div><div id="syncStamp" class="sync-stamp" role="status">Подключение к данным</div><div class="kicker">Новый спринт · 7-30 сентября 2026</div><div class="title-line"><h1 class="title" id="title">Назначенные встречи</h1><span class="range" id="range"></span><select class="scope" id="scope" aria-label="Выбор отдела"></select></div><div class="sub" id="sub">3 встречи за день дают золото, каждая следующая приносит +1 000 ₽</div></div>
      <div class="stats"><div class="stat"><span id="countLabel">В списке</span><b id="peopleCount">0</b></div><div class="stat"><span>Назначено</span><b id="assigned">0</b></div><div class="stat"><span>Золотых дней</span><b id="goldDays">0</b></div><div class="stat money"><span>Заработано</span><b id="money">0 ₽</b></div></div>
    </header>
    <nav class="page-controls tv-pages" id="tvPages" aria-label="Переключение экрана"><button id="prevScreen" type="button">Назад</button><span id="mobileScreenNo" role="status"></span><button id="nextScreen" type="button">Далее</button></nav>
    <main class="board" id="board"></main>
    <footer><span id="hint">Стрелки на пульте переключают экран</span><span class="screen-no" id="screenNo"></span><a class="tech" href="./index.html">Техническая панель</a></footer>
  </div>
  <script src="./contest-data.js?v=5"></script>
  <script src="./contest-core.js?v=5"></script>
  <script>
    window.tvPublished=Contest.cached();
    const allPeople=window.ContestPeople,allDays=Array.from({length:30},(_,i)=>i+1),key='golden-meetings-september-7-30-2026-v1',daysPerScreen=7,weeks=[6,13,20,27],formatter=new Intl.NumberFormat('ru-RU');
    const mobile=matchMedia('(max-width:1000px)');
    let scopeValue=new URLSearchParams(location.search).get('scope')||'all';
    let screen=0,state,people=[],rowLimit=8,peoplePages=1,screenCount=1,rows=[],dayHeaders=[],deptRows=[];
    const rub=n=>formatter.format(n)+' ₽',weekday=d=>['вс','пн','вт','ср','чт','пт','сб'][new Date(2026,8,d).getDay()],level=n=>n>=4?4:n;
    const period=a=>a.slice(6,30),bonus=a=>period(a).reduce((sum,n)=>sum+Math.max(0,n-3)*1000,0),assignedTotal=p=>period(state.assigned[p.id]).reduce((a,b)=>a+b,0);
    function blank(){const assigned={},held={};allPeople.forEach(p=>{assigned[p.id]=Array(30).fill(0);held[p.id]=0});return{assigned,held}}
    function load(){return window.tvPublished;}
    function setPeople(){if(scopeValue==='departments'){people=[...allPeople];rowLimit=1;peoplePages=1;screenCount=1;screen=0;return}if(scopeValue==='top10')people=[...allPeople].sort((a,b)=>assignedTotal(b)-assignedTotal(a)||bonus(state.assigned[b.id])-bonus(state.assigned[a.id])||allPeople.indexOf(a)-allPeople.indexOf(b)).slice(0,10);else if(scopeValue.startsWith('dept:'))people=allPeople.filter(p=>p.dept===scopeValue.slice(5));else people=[...allPeople];rowLimit=scopeValue.startsWith('dept:')?Math.max(1,people.length):scopeValue==='top10'?10:8;peoplePages=Math.max(1,Math.ceil(people.length/rowLimit));screenCount=peoplePages*weeks.length;if(screen>=screenCount)screen=0}
    function buildScope(){const select=document.getElementById('scope'),departments=[...new Set(allPeople.map(p=>p.dept))];[['all','Все отделы'],['top10','Топ-10 сотрудников'],['departments','Топ отделов'],...departments.map(d=>['dept:'+d,d])].forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;select.appendChild(o)});select.value=scopeValue;select.onchange=()=>{scopeValue=select.value;const url=new URL(location.href);if(scopeValue==='all')url.searchParams.delete('scope');else url.searchParams.set('scope',scopeValue);history.pushState(null,'',url);rebuild();}}
    function build(){const board=document.getElementById('board');board.style.setProperty('--rows',rowLimit);const table=document.createElement('table'),thead=document.createElement('thead'),hr=document.createElement('tr'),nameHead=document.createElement('th');nameHead.className='name';nameHead.textContent='Сотрудник';hr.appendChild(nameHead);for(let i=0;i<daysPerScreen;i++){const th=document.createElement('th'),b=document.createElement('b'),s=document.createElement('small');th.className='day';th.append(b,s);hr.appendChild(th);dayHeaders.push({th,b,s})}for(const pair of [['total','Итого'],['gold-days','3+'],['bonus','Бонус']]){const th=document.createElement('th');th.className=pair[0];th.textContent=pair[1];hr.appendChild(th)}thead.appendChild(hr);table.appendChild(thead);const tbody=document.createElement('tbody');for(let i=0;i<rowLimit;i++){const tr=document.createElement('tr'),name=document.createElement('td'),nb=document.createElement('b'),ns=document.createElement('small');name.className='name';name.append(nb,ns);tr.appendChild(name);const cells=[];for(let j=0;j<daysPerScreen;j++){const td=document.createElement('td');td.className='metric lv0';tr.appendChild(td);cells.push(td)}const total=document.createElement('td'),gold=document.createElement('td'),money=document.createElement('td');total.className='total';gold.className='gold-days';money.className='bonus';tr.append(total,gold,money);tbody.appendChild(tr);rows.push({tr,nb,ns,cells,total,gold,money})}table.appendChild(tbody);board.appendChild(table)}
    function departmentRanking(){const totals=new Map();allPeople.forEach(p=>totals.set(p.dept,(totals.get(p.dept)||0)+assignedTotal(p)));return [...totals].map(([dept,total])=>({dept,total})).sort((a,b)=>b.total-a.total||a.dept.localeCompare(b.dept,'ru'))}
    function makeCell(className,text){const el=document.createElement('div');el.className=className;if(text!==undefined)el.textContent=text;return el}
    function buildDepartments(){const board=document.getElementById('board'),ranking=departmentRanking();board.className='dept-board';board.style.setProperty('--dept-rows',ranking.length);const head=document.createElement('div');head.className='dept-head';head.append(makeCell('','Место'),makeCell('','Отдел'),makeCell('','Назначено всего'));board.appendChild(head);ranking.forEach(()=>{const row=document.createElement('section'),rank=makeCell('dept-rank'),name=makeCell('dept-name'),total=makeCell('dept-total');row.className='dept-row';row.append(rank,name,total);board.appendChild(row);deptRows.push({rank,name,total})});document.getElementById('title').textContent='Топ отделов по назначенным';document.getElementById('sub').textContent='Общее количество назначений · при равном результате места одинаковые';document.getElementById('range').style.display='none';document.getElementById('hint').textContent='Результат считается по всем сотрудникам отдела за период 7-30 сентября'}
    function totals(){let sum=0,gold=0,money=0;people.forEach(p=>{const a=state.assigned[p.id],values=period(a);sum+=values.reduce((x,y)=>x+y,0);gold+=values.filter(n=>n>=3).length;money+=bonus(a)});document.getElementById('countLabel').textContent=scopeValue==='departments'?'Отделов':'В списке';document.getElementById('peopleCount').textContent=scopeValue==='departments'?departmentRanking().length:people.length;document.getElementById('assigned').textContent=sum;document.getElementById('goldDays').textContent=gold;document.getElementById('money').textContent=rub(money)}
    function render(){const weekIndex=Math.floor(screen/peoplePages),peoplePage=screen%peoplePages,start=weeks[weekIndex],count=Math.min(daysPerScreen,30-start);document.getElementById('range').textContent=(start+1)+'-'+(start+count)+' сентября';dayHeaders.forEach((h,i)=>{const shown=i<count,d=start+i+1,w=shown?weekday(d):'';h.th.className='day '+((w==='сб'||w==='вс')?'weekend ':'')+(shown?'':'off');h.b.textContent=shown?d:'';h.s.textContent=w});rows.forEach((r,i)=>{const p=people[peoplePage*rowLimit+i];r.tr.classList.toggle('empty',!p);if(!p)return;const a=state.assigned[p.id];r.nb.textContent=(scopeValue==='top10'?(Contest.rank(allPeople.map(assignedTotal),assignedTotal(p))||'·')+'. ':'')+p.name;r.ns.textContent=p.dept+' · '+p.role;r.cells.forEach((c,j)=>{const shown=j<count,n=shown?(a[start+j]||0):0;c.className='metric lv'+level(n)+(shown?'':' off');c.textContent=shown?(n||'·'):'';c.dataset.date=shown?(start+j+1)+' '+weekday(start+j+1):''});r.total.textContent=assignedTotal(p);r.gold.textContent=period(a).filter(n=>n>=3).length;r.money.textContent=rub(bonus(a))});document.getElementById('screenNo').textContent='Экран '+(screen+1)+' из '+screenCount;document.getElementById('mobileScreenNo').textContent=(screen+1)+' / '+screenCount;document.getElementById('tvPages').hidden=screenCount<=1}
    function renderDepartments(){const ranking=departmentRanking(),values=ranking.map(x=>x.total);ranking.forEach((item,i)=>{const r=deptRows[i];const rank=Contest.rank(values,item.total);r.rank.textContent=rank||'·';r.rank.className='dept-rank '+(rank&&rank<=3?'top'+rank:'');r.name.textContent=item.dept;r.total.textContent=formatter.format(item.total)});document.getElementById('screenNo').innerHTML='<b>'+deptRows.length+'</b> отделов'}
    function forward(){if(scopeValue==='departments')return;screen=(screen+1)%screenCount;render()}function backward(){if(scopeValue==='departments')return;screen=(screen-1+screenCount)%screenCount;render()}function refresh(){state=load();setPeople();totals();scopeValue==='departments'?renderDepartments():render()}
    function rebuild(){screen=0;state=load();rows=[];dayHeaders=[];deptRows=[];setPeople();const board=document.getElementById('board');board.replaceChildren();board.className='board';document.getElementById('title').textContent='Назначенные встречи';document.getElementById('sub').textContent='3 встречи за день дают золото, каждая следующая приносит +1 000 ₽';document.getElementById('hint').textContent='Итоги и бонусы за весь конкурс · 7–30 сентября';document.getElementById('range').style.display='';document.getElementById('tvPages').hidden=scopeValue==='departments';if(scopeValue==='departments'){buildDepartments();totals();renderDepartments()}else{build();totals();render()}}
    addEventListener('popstate',()=>{scopeValue=new URLSearchParams(location.search).get('scope')||'all';document.getElementById('scope').value=scopeValue;rebuild();});document.getElementById('prevScreen').onclick=backward;document.getElementById('nextScreen').onclick=forward;
    buildScope();rebuild();setInterval(()=>{if(!document.hidden&&!mobile.matches&&scopeValue!=='departments')forward()},30000);addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea,button'))return;if(e.key==='ArrowRight'||e.key==='PageDown')forward();if(e.key==='ArrowLeft'||e.key==='PageUp')backward()});
    Contest.watch((data,status)=>{window.tvPublished=data;document.getElementById('syncStamp').textContent=status.message;document.getElementById('syncStamp').classList.toggle('pending',!!status.error);if(status.changed)refresh();});
  </script>
</body>
</html>
