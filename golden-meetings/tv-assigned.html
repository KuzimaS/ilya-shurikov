<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070d17">
  <title>ТВ · Назначенные встречи</title>
  <style>
    :root{--bg:#060b14;--panel:#0e1928;--line:#203149;--text:#f7f2e5;--muted:#8396af;--gold:#f4bd45;--gold2:#ffe79b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{background:radial-gradient(circle at 82% -15%,rgba(244,189,69,.2),transparent 34%),radial-gradient(circle at 15% 0,rgba(50,113,190,.14),transparent 30%),#060b14}
    .screen{height:100vh;display:grid;grid-template-rows:154px minmax(0,1fr) 42px;padding:22px 26px 12px;gap:13px}
    header{display:grid;grid-template-columns:1fr auto;align-items:start;padding:21px 24px;border:1px solid rgba(255,255,255,.09);border-radius:22px;background:linear-gradient(135deg,rgba(19,34,54,.97),rgba(9,17,30,.97));box-shadow:0 24px 70px rgba(0,0,0,.34);position:relative;overflow:hidden}
    header:after{content:"";position:absolute;right:30%;top:-130px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,205,91,.18),transparent 68%)}
    .kicker{color:#ffd875;text-transform:uppercase;letter-spacing:.17em;font-size:12px;font-weight:900}.title{margin:8px 0 0;font-size:35px;line-height:1;letter-spacing:-.035em}.sub{margin-top:9px;color:#93a5bc;font-size:14px}.gold{color:#ffd875}
    .stats{display:flex;gap:10px;position:relative;z-index:2}.stat{min-width:154px;padding:14px 16px;background:rgba(5,11,20,.52);border:1px solid rgba(255,255,255,.08);border-radius:15px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.09em}.stat b{display:block;margin-top:5px;font-size:24px}.stat.money b{color:#ffd875}
    .board{min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:#091321;box-shadow:0 25px 80px rgba(0,0,0,.32)}
    table{border-collapse:separate;border-spacing:0;width:100%;height:100%;table-layout:fixed}th,td{border-right:1px solid #19283b;border-bottom:1px solid #19283b;text-align:center;padding:0}
    thead th{height:45px;background:#111e2f;color:#8194ad;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.name{width:260px;text-align:left;padding:0 14px;background:#101b2b}.name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name small{display:block;margin-top:2px;color:#7a8da6;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day{width:32px}.day b{display:block;color:#dce5ef;font-size:12px}.day small{font-size:8px}.weekend{background:#171929!important;color:#b7a3ca!important}
    tbody tr{height:calc((100% - 45px)/12)}tbody td{background:#0f1927;font-size:14px;font-weight:900}.lv0{color:#43546b}.lv1{background:#29221d!important;color:#a67c50}.lv2{background:#4c3b20!important;color:#e1b85f}.lv3{background:linear-gradient(145deg,#97610d,#e2a832)!important;color:#241700}.lv4{background:linear-gradient(145deg,#ffe8a6,#efa91f)!important;color:#201300;box-shadow:inset 0 0 0 1px #fff0b6,0 0 18px rgba(238,172,40,.14)}
    .total{width:72px;background:#101c2d;font-size:16px}.days{width:70px;background:#111d2e;color:#dcb14f}.bonus{width:108px;background:#171c21;color:#ffd36b;font-size:15px}.dept-row td{height:28px;background:#17243a;color:#d5aa54;text-align:left;padding:0 14px;font-size:9px;letter-spacing:.13em;text-transform:uppercase}
    footer{display:flex;align-items:center;justify-content:space-between;padding:0 5px;color:#6f829c;font-size:11px}.legend{display:flex;gap:7px;align-items:center}.sw{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:9px;font-weight:900}.pager{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:20px;background:#304057}.dot.active{width:25px;background:#e9ad37}.tech{color:#677b95;text-decoration:none}.tech:hover{color:#ffd875}
    @media(max-width:1500px){.screen{padding:14px 16px 8px;grid-template-rows:136px minmax(0,1fr) 34px}.title{font-size:29px}.stat{min-width:125px}.name{width:225px}.bonus{width:94px}.day{width:29px}}
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div><div class="kicker">Золотой календарь · сентябрь 2026</div><h1 class="title">Назначенные встречи</h1><div class="sub">Цель дня: <span class="gold">3 встречи</span> · каждая следующая приносит <span class="gold">+1 000 ₽</span></div></div>
      <div class="stats"><div class="stat"><span>Участников</span><b id="people">65</b></div><div class="stat"><span>Назначено</span><b id="assigned">0</b></div><div class="stat"><span>Золотых дней</span><b id="goldDays">0</b></div><div class="stat money"><span>Заработано</span><b id="money">0 ₽</b></div></div>
    </header>
    <main class="board" id="board"></main>
    <footer><div class="legend"><span class="sw lv0">0</span><span class="sw lv1">1</span><span class="sw lv2">2</span><span class="sw lv3">3</span><span class="sw lv4">4+</span><span>До золота · цель · бонус</span></div><div class="pager" id="pager"></div><a class="tech" href="./index.html">Техническая панель</a></footer>
  </div>
  <script src="./contest-data.js"></script>
  <script>
    const people=window.ContestPeople, days=Array.from({length:30},(_,i)=>i+1), key='golden-meetings-september-2026-v1', perPage=12;
    let page=0,lastRaw='';
    const rub=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const blank=()=>{const assigned={},held={};people.forEach(p=>{assigned[p.id]=Array(30).fill(0);held[p.id]=0});return{assigned,held}};
    function load(){const base=blank();try{const raw=localStorage.getItem(key);lastRaw=raw||'';const saved=raw?JSON.parse(raw):window.ContestPublishedState;people.forEach(p=>{if(Array.isArray(saved?.assigned?.[p.id]))base.assigned[p.id]=days.map((_,i)=>Math.max(0,Number(saved.assigned[p.id][i])||0));base.held[p.id]=Math.max(0,Number(saved?.held?.[p.id])||0)})}catch{}return base}
    let state=load();
    const weekday=d=>['вс','пн','вт','ср','чт','пт','сб'][new Date(2026,8,d).getDay()];
    const level=n=>n>=4?4:n;
    const bonus=a=>a.reduce((s,n)=>s+Math.max(0,n-3)*1000,0);
    function totals(){let assigned=0,gold=0,money=0;people.forEach(p=>{const a=state.assigned[p.id];assigned+=a.reduce((x,y)=>x+y,0);gold+=a.filter(n=>n>=3).length;money+=bonus(a)});document.getElementById('assigned').textContent=assigned;document.getElementById('goldDays').textContent=gold;document.getElementById('money').textContent=rub(money)}
    function render(){const pages=Math.ceil(people.length/perPage);if(page>=pages)page=0;const list=people.slice(page*perPage,(page+1)*perPage);let h='<table><thead><tr><th class="name">Сотрудник</th>';days.forEach(d=>{const w=weekday(d),we=w==='сб'||w==='вс';h+=`<th class="day ${we?'weekend':''}"><b>${d}</b><small>${w}</small></th>`});h+='<th class="total">Итого</th><th class="days">3+</th><th class="bonus">Бонус</th></tr></thead><tbody>';list.forEach(p=>{const a=state.assigned[p.id],sum=a.reduce((x,y)=>x+y,0),gold=a.filter(n=>n>=3).length;h+=`<tr><td class="name"><b>${esc(p.name)}</b><small>${esc(p.dept)} · ${esc(p.role)}</small></td>`;a.forEach(n=>h+=`<td class="lv${level(n)}">${n||'·'}</td>`);h+=`<td class="total">${sum}</td><td class="days">${gold}</td><td class="bonus">${rub(bonus(a))}</td></tr>`});for(let i=list.length;i<perPage;i++)h+='<tr><td colspan="34"></td></tr>';h+='</tbody></table>';document.getElementById('board').innerHTML=h;document.getElementById('pager').innerHTML=Array.from({length:pages},(_,i)=>`<span class="dot ${i===page?'active':''}"></span>`).join('');totals()}
    function next(){page=(page+1)%Math.ceil(people.length/perPage);render()}
    setInterval(next,12000);setInterval(()=>{const raw=localStorage.getItem(key)||'';if(raw!==lastRaw){state=load();render()}},3000);
    addEventListener('storage',()=>{state=load();render()});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')next();if(e.key==='ArrowLeft'||e.key==='PageUp'){page=(page-1+Math.ceil(people.length/perPage))%Math.ceil(people.length/perPage);render()}});
    render();
  </script>
</body>
</html>
